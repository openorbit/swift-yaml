name: Swift

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  macos:
    runs-on: macos-26
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Setup Swift
      uses: SwiftyLab/setup-swift@latest
      with:
        swift-version: "6.2.0"
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
      env:
        YAML_TEST_SUITE_ALLOW_FAILURES: "1"
        YAML_TEST_SUITE_REPORT_PATH: /tmp/yaml-test-suite-report.html
    - name: Upload YAML test suite report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: yaml-test-suite-report-linux
        path: /tmp/yaml-test-suite-report.html
      env:
        YAML_TEST_SUITE_ALLOW_FAILURES: "1"
        YAML_TEST_SUITE_REPORT_PATH: ${{ runner.temp }}/yaml-test-suite-report.html
    - name: Upload YAML test suite report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: yaml-test-suite-report-macos
        path: ${{ runner.temp }}/yaml-test-suite-report.html

  linux:
    runs-on: ubuntu-latest
    container:
      image: swift:6.2
    steps:
    - name: Checkout
      uses: actions/checkout@v3
      with:
        submodules: recursive
    - name: Setup Swift
      uses: SwiftyLab/setup-swift@latest
      with:
        swift-version: "6.2.0"
    - name: Build
      run: swift build -v
    - name: Run tests
      run: swift test -v
